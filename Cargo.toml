[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Tobias Steinhaeusler"]
edition = "2024"
# Slint 1.x's MSRV.
rust-version = "1.92"
license = "GPL-3.0-or-later"
homepage = "https://github.com/tobytaken/prism-electron"
repository = "https://github.com/tobytaken/prism-electron"
publish = false

[workspace.dependencies]
prism-drivers = { path = "crates/prism-drivers" }
prism-gpu = { path = "crates/prism-gpu" }
prism-protocol = { path = "crates/prism-protocol" }
prism-ui = { path = "crates/prism-ui" }

# Slint, its testing backend and its core are pinned exactly and bumped together (#120).
i-slint-backend-testing = "=1.18.1"
# Reads the window's minimum size in tests, which no public API exposes.
i-slint-core = { version = "=1.18.1", default-features = false }
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
    # Reaches the winit window to raise it with an activation token. Pinned with Slint above.
    "unstable-winit-030",
] }
slint-build = "=1.18.1"

libc = "0.2.177"
nvml-wrapper = "0.12.1"
once_cell = "1.21.3"
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23.0"
thiserror = "2.0.18"
toml = "0.9.8"
users = "0.11.0"
# The single-instance bus; the same zbus Slint's accessibility already uses.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# Raising the window on Wayland with a later launch's activation token; the same crates winit uses.
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

# The toolkit spike's size profile (#102, #167), except that panics unwind: prismd catches them so
# a failing GPU operation fails only its own request. The README says why the GUI unwinds too.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
