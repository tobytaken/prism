[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Tobias Steinhaeusler"]
edition = "2024"
# Slint 1.x's MSRV.
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
prism-drivers = { path = "crates/prism-drivers" }
prism-gpu = { path = "crates/prism-gpu" }
prism-protocol = { path = "crates/prism-protocol" }
prism-ui = { path = "crates/prism-ui" }

# Slint and its testing backend are pinned exactly and bumped together (#120).
i-slint-backend-testing = "=1.18.1"
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
] }
slint-build = "=1.18.1"

libc = "0.2.177"
nvml-wrapper = "0.12.1"
once_cell = "1.21.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23.0"
thiserror = "2.0.18"
toml = "0.9.8"
users = "0.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
