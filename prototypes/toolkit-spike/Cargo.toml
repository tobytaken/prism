# PROTOTYPE, throwaway. Wayfinder ticket "Which toolkit does Prism use? (spike)" (#102).
[workspace]
resolver = "3"
members = ["core", "gpui", "slint"]

[workspace.package]
edition = "2024"
publish = false

# Measured profile: the same for both toolkits.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Fast iteration while building the spike; never measured.
[profile.spike]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
panic = "unwind"
