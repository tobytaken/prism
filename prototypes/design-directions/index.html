<!doctype html>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Which design direction should Prism take?" (#101).
  Three design directions for the native Prism GUI, switchable via ?variant=A|B|C
  (plus ?size=default|half|min|compact and ?daemon=0). Open this file in a browser; no build step.

  Native-drawable only: solid fills, rounded corners, shadows, gradients, custom paths (canvas).
  No backdrop blur, no filters, no CSS-only tricks. All data is simulated in memory.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Prism design directions</title>
<style>
html,body{margin:0;height:100%;}
body{background:linear-gradient(160deg,#3b4150 0%,#23262e 60%,#1b1d22 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,sans-serif;}
#stage{position:relative;}
#win{position:relative;flex:none;overflow:hidden;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);transform-origin:center center;}

/* ---------- generic window plumbing (bindings, not layout) ---------- */
.win{display:flex;flex-direction:column;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs,12px);line-height:1.35;}
.win *{box-sizing:border-box;}
.win button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;}
.win input{font:inherit;color:inherit;}
.win h1,.win h2,.win h3,.win p{margin:0;font-weight:inherit;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.sp{flex:1;}
.win canvas{display:block;width:100%;height:100%;}
.win kbd{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;border:1px solid var(--border);color:var(--muted);}
[data-needsd]{display:none!important;}
.nod [data-needsd]{display:flex!important;}
[data-pend]{display:none;}
[data-pend].on{display:inline;}
[data-problem]{display:none!important;}
[data-problem].on{display:flex!important;}
.nod [data-edit],.nod [data-step],.nod [data-set],.nod [data-drag],.nod [data-curve]{opacity:.45;pointer-events:none;}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:16px;}
.drag{user-select:none;}

/* generic overlays, themed by each variant's variables */
.ov{position:absolute;z-index:50;background:var(--panel2,var(--panel));border:1px solid var(--border);border-radius:var(--radius,6px);box-shadow:0 12px 32px rgba(0,0,0,.35);color:var(--text);}
.ov-menu{min-width:220px;padding:4px;}
.ov-menu button{display:flex;width:100%;padding:5px 8px;border-radius:calc(var(--radius,6px) - 2px);gap:8px;}
.ov-menu button:hover{background:var(--hover);}
.ov-menu button[disabled]{opacity:.4;pointer-events:none;}
.ov-menu hr{border:0;border-top:1px solid var(--border);margin:4px 0;}
.ov-palette{left:50%;top:56px;width:520px;margin-left:-260px;padding:0;overflow:hidden;}
.ov-palette input{width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:transparent;outline:none;font-size:13px;}
.ov-palette .items{max-height:300px;overflow:auto;padding:4px;}
.ov-palette .it{display:flex;padding:6px 8px;border-radius:4px;gap:8px;}
.ov-palette .it.on{background:var(--hover);}
.ov-activity{right:8px;bottom:34px;width:380px;padding:10px;}
.ov-activity h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px;}
.ov-activity .ev{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--border);align-items:baseline;}
.ov-activity .ev:first-of-type{border-top:0;}
.ov-activity .act{color:var(--accent);}
.ov-activity .bad{color:var(--danger);}

/* ---------- prototype switcher (not part of any design) ---------- */
#switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:999px;background:#fff;color:#111;font:12px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 0 2px #e0249a;}
#switcher button{border:0;background:#f0f0f0;border-radius:999px;padding:6px 10px;cursor:pointer;font:inherit;color:#111;}
#switcher button:hover{background:#e3e3e3;}
#switcher button.on{background:#111;color:#fff;}
#switcher .lbl{min-width:170px;text-align:center;font-weight:600;}
#switcher .div{width:1px;height:18px;background:#ccc;margin:0 4px;}
#switcher .tag{font-size:10px;font-weight:700;color:#e0249a;letter-spacing:.06em;padding:0 6px;}

/* =====================================================================
   VARIANT A · Instrument. Zed-like graphite, hairline panes, amber accent.
   Workspace = vitals strip on top, then one column per control domain.
   ===================================================================== */
.vA{--bg:#18181b;--panel:#1f1f23;--panel2:#26262b;--border:#2e2e34;--hover:#2c2c32;--text:#d6d6db;--muted:#8b8b94;--accent:#f0a830;--danger:#f2665a;--ok:#5ccf8a;
  --temp:#f2665a;--util:#7aa2f7;--power:#f0a830;--fan:#55d0b8;--gclk:#c49bff;--mclk:#8fb8ff;--vram:#7aa2f7;--grid:#2a2a30;--line:#d6d6db;
  --font:"Inter","IBM Plex Sans",system-ui,sans-serif;--mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;--radius:6px;--fs:12px;}
.vA .titlebar{height:34px;flex:none;display:flex;align-items:center;padding:0 6px 0 12px;gap:10px;border-bottom:1px solid var(--border);background:var(--bg);}
.vA .tb-left{display:flex;align-items:center;gap:8px;width:224px;}
.vA .logo{color:var(--accent);font-size:13px;}
.vA .appname{font-weight:600;}
.vA .crumb{color:var(--muted);}
.vA .tb-search{flex:0 1 420px;margin:0 auto;display:flex;align-items:center;gap:8px;height:22px;padding:0 8px;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--muted);}
.vA .tb-search span{flex:1;}
.vA .tb-right{display:flex;align-items:center;gap:2px;}
.vA .wc button,.vA .tbbtn{width:28px;height:24px;border-radius:4px;text-align:center;color:var(--muted);}
.vA .wc button:hover,.vA .tbbtn:hover{background:var(--hover);color:var(--text);}
.vA .wc{display:flex;gap:2px;margin-left:6px;}
.vA .body{flex:1;display:flex;min-height:0;}
.vA .side{width:236px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:8px 6px;gap:2px;background:var(--bg);}
.vA .sect{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px;}
.vA .gpu{display:block;width:100%;padding:7px 8px 6px;border-radius:5px;position:relative;border:1px solid transparent;}
.vA .gpu:hover{background:var(--hover);}
.vA .gpu.sel{background:var(--panel2);border-color:var(--border);}
.vA .gpu.sel::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent);}
.vA .gpu-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.vA .gname{font-weight:600;}
.vA .gprof{margin-left:auto;font-size:11px;color:var(--muted);}
.vA .vitals{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-size:11px;}
.vA .vitals span{display:flex;justify-content:space-between;}
.vA .vitals i{font-style:normal;color:var(--muted);}
.vA .spark{height:18px;margin-top:5px;}
.vA .gwarn{color:var(--danger);font-size:11px;align-items:center;gap:4px;margin-top:4px;}
.vA .nav{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:5px;color:var(--muted);}
.vA .nav:hover{background:var(--hover);color:var(--text);}
.vA .nav.sel{background:var(--panel2);color:var(--text);}
.vA .nav svg{width:14px;height:14px;}
.vA .main{flex:1;display:flex;flex-direction:column;min-width:0;}
.vA .wshead{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--border);}
.vA .wshead h1{font-size:14px;font-weight:600;}
.vA .wshead .sub{font-size:11px;}
.vA .profbtn{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:5px;background:var(--panel);}
.vA .profbtn:hover{background:var(--hover);}
.vA .mod{color:var(--accent);font-size:11px;}
.vA .seg{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;background:var(--panel);}
.vA .seg button{padding:3px 8px;color:var(--muted);border-left:1px solid var(--border);text-align:center;}
.vA .seg button:first-child{border-left:0;}
.vA .seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent);}
.vA .needsd{align-items:center;gap:8px;margin:8px 12px 0;padding:6px 10px;border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:5px;background:var(--panel);}
.vA .needsd button{color:var(--accent);}
.vA .content{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;min-height:0;overflow:hidden;}
.vA .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none;}
.vA .pane{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0;min-height:0;}
.vA .spane{display:flex;height:72px;}
.vA .spane .lab{width:108px;flex:none;padding:8px 10px;display:flex;flex-direction:column;}
.vA .spane .lab .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.vA .spane .lab .v{font-size:20px;margin-top:2px;}
.vA .spane .lab .s{font-size:10px;color:var(--muted);margin-top:auto;}
.vA .spane .ch{flex:1;padding:6px 6px 6px 0;min-width:0;}
.vA .cols{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-height:0;}
.vA .pane > header{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-bottom:1px solid var(--border);flex:none;}
.vA .pane > header h2{font-weight:600;}
.vA .read{font-size:11px;color:var(--muted);}
.vA .read b{color:var(--text);font-weight:500;}
.vA .pchart{flex:1;min-height:90px;padding:6px 6px 2px 6px;border-bottom:1px solid var(--border);}
.vA .pcurve{flex:1;min-height:150px;padding:6px 6px 2px 2px;border-bottom:1px solid var(--border);}
.vA .ctl{padding:8px 10px;display:flex;flex-direction:column;gap:7px;overflow:hidden;}
.vA .row{display:flex;align-items:center;gap:8px;}
.vA .row label{color:var(--muted);}
.vA .val{font-size:13px;}
.vA .pend{color:var(--accent);font-size:12px;}
.vA .small{font-size:10px;}
.vA .stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:5px;background:var(--bg);}
.vA .stepper button{width:22px;height:22px;text-align:center;color:var(--muted);}
.vA .stepper button:hover{color:var(--text);background:var(--hover);}
.vA .stepper span{min-width:72px;text-align:center;font-size:12px;}
.vA .numin{width:62px;height:22px;padding:0 6px;border:1px solid var(--border);border-radius:5px;background:var(--bg);text-align:right;}
.vA .fanrow{display:flex;gap:8px;font-size:11px;}
.vA .fanrow b{font-weight:500;}
.vA .inlinebad{align-items:center;gap:8px;padding:5px 8px;border-radius:5px;background:#3a1f1d;color:#ffb4ab;font-size:11px;}
.vA .inlinebad button{margin-left:auto;color:#fff;text-decoration:underline;}
.vA .details{flex:none;display:flex;align-items:center;gap:10px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);font-size:11px;white-space:nowrap;overflow:hidden;}
.vA .applybar{display:none;flex:none;align-items:center;gap:8px;height:22px;padding:0 3px 0 10px;border-radius:5px;background:#3a2c12;border:1px solid #5a4318;color:#ffd99a;}
.vA.pending .applybar{display:flex;}
.vA .applybar .hint{color:#c9a565;font-size:11px;}
.vA .applybar button{height:16px;padding:0 8px;border-radius:3px;border:1px solid #6b5020;text-align:center;line-height:14px;}
.vA .applybar button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600;}
.vA .applybar kbd{border:0;padding:0;color:#4a3410;}
.vA .status{height:30px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);background:var(--bg);}
.vA .status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;}
.nod.vA .status .dot{background:var(--muted);}
.vA .status button:hover{color:var(--text);}
.vA .status .prob{color:var(--danger);}
.vA .placeholder{padding:40px;color:var(--muted);}
.vA .placeholder h1{font-size:18px;color:var(--text);margin-bottom:8px;}
/* A narrow: Power + Clocks stack, Cooling gets the second column */
.vA.sz-half .side,.vA.sz-min .side{width:196px;}
.vA.sz-half .tb-left,.vA.sz-min .tb-left{width:auto;}
.vA.sz-half .cols,.vA.sz-min .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:1fr 1fr;}
.vA.sz-half .cols > section:nth-child(3),.vA.sz-min .cols > section:nth-child(3){grid-column:2;grid-row:1 / span 2;}
.vA.sz-half .wshead .sub,.vA.sz-min .wshead .sub,.vA.sz-half .applybar .hint,.vA.sz-min .applybar .hint{display:none;}
.vA.sz-min .strip{display:none;}
.vA.sz-half .wshead h1,.vA.sz-min .wshead h1{font-size:13px;}
/* A compact */
.vA .cmp{flex:1;display:flex;flex-direction:column;padding:6px;gap:4px;min-height:0;}
.vA .cmp .gpu{background:var(--panel);border-color:var(--border);}
.vA .cmp .vitals{font-size:12px;}
.vA .cmp .prow{display:flex;align-items:center;gap:8px;padding:6px 8px;}

/* =====================================================================
   VARIANT B · Inspector. Blue-black, big canvas + property inspector.
   The canvas follows the inspector group you're working in.
   ===================================================================== */
.vB{--bg:#0f1318;--panel:#141a21;--panel2:#1a212a;--border:#232c37;--hover:#1f2833;--text:#cfd8e3;--muted:#7a8696;--accent:#7fd13b;--danger:#ff6b6b;--ok:#7fd13b;
  --temp:#ff8a5c;--util:#4fb3ff;--power:#ffcf4a;--fan:#5ee0c0;--gclk:#b48cff;--mclk:#ff7ac6;--vram:#4fb3ff;--grid:#1c242e;--line:#cfd8e3;
  --font:"Inter","Cantarell",system-ui,sans-serif;--mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;--radius:4px;--fs:12px;}
.vB .titlebar{height:36px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;background:var(--panel);border-bottom:1px solid var(--border);}
.vB .logo{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#7fd13b,#2c8a5a);}
.vB .crumbs{display:flex;gap:6px;color:var(--muted);}
.vB .crumbs b{color:var(--text);font-weight:500;}
.vB .tbbtn{height:24px;padding:0 8px;border-radius:4px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.vB .tbbtn:hover{background:var(--hover);color:var(--text);}
.vB .wc{display:flex;gap:4px;margin-left:4px;}
.vB .wc button{width:24px;height:24px;border-radius:50%;text-align:center;color:var(--muted);background:var(--panel2);}
.vB .wc button:hover{color:var(--text);background:var(--hover);}
.vB .body{flex:1;display:flex;min-height:0;}
.vB .side{width:212px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);}
.vB .side .hd{font-size:11px;color:var(--muted);padding:10px 12px 6px;display:flex;}
.vB .gpu{display:block;width:100%;padding:8px 12px 10px;border-left:2px solid transparent;}
.vB .gpu:hover{background:var(--hover);}
.vB .gpu.sel{background:var(--panel2);border-left-color:var(--accent);}
.vB .gname{display:flex;font-weight:500;margin-bottom:6px;gap:6px;align-items:center;}
.vB .gname .warn{color:var(--danger);font-size:11px;}
.vB .meter{display:grid;grid-template-columns:30px 1fr 46px;align-items:center;gap:6px;font-size:10px;margin-top:3px;}
.vB .meter i{font-style:normal;color:var(--muted);}
.vB .meter .bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden;}
.vB .meter .bar div{height:100%;border-radius:2px;}
.vB .meter span{text-align:right;}
.vB .navs{margin-top:auto;border-top:1px solid var(--border);padding:6px;}
.vB .nav{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:4px;color:var(--muted);}
.vB .nav:hover{background:var(--hover);color:var(--text);}
.vB .nav.sel{color:var(--text);background:var(--panel2);}
.vB .nav svg{width:14px;height:14px;}
.vB .center{flex:1;display:flex;flex-direction:column;min-width:0;}
.vB .toolbar{height:36px;flex:none;display:flex;align-items:stretch;gap:0;padding:0 8px;border-bottom:1px solid var(--border);}
.vB .tab{padding:0 12px;color:var(--muted);display:flex;align-items:center;border-bottom:2px solid transparent;}
.vB .tab:hover{color:var(--text);}
.vB .tab.on{color:var(--text);border-bottom-color:var(--accent);}
.vB .seg{display:flex;align-items:center;gap:2px;}
.vB .seg button{padding:3px 7px;border-radius:4px;color:var(--muted);}
.vB .seg button.on{background:var(--panel2);color:var(--text);}
.vB .canvaswrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px;gap:10px;}
.vB .cbox{position:relative;min-height:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px;}
.vB .cbox .cap{position:absolute;left:46px;top:7px;font-size:11px;color:var(--muted);pointer-events:none;}
.vB .cbox .cap b{color:var(--text);font-weight:500;}
.vB .hintline{font-size:11px;color:var(--muted);flex:none;}
.vB .insp{width:312px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--border);min-height:0;}
.vB .ihead{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.vB .ihead h1{font-size:13px;font-weight:600;}
.vB .select{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:4px;background:var(--bg);border:1px solid var(--border);}
.vB .select:hover{border-color:#33404f;}
.vB .mod{color:var(--accent);font-size:11px;}
.vB .needsd{margin:8px 12px 0;padding:6px 8px;border-radius:4px;background:var(--panel2);border:1px dashed #3a4a5c;align-items:center;gap:6px;font-size:11px;}
.vB .needsd button{color:var(--accent);margin-left:auto;}
.vB .groups{flex:1;overflow:auto;}
.vB .grp{border-bottom:1px solid var(--border);}
.vB .grp > button{display:flex;align-items:center;gap:6px;width:100%;padding:8px 12px;font-weight:600;}
.vB .grp > button:hover{background:var(--hover);}
.vB .grp.focus > button{color:var(--accent);}
.vB .grp > button .r{margin-left:auto;font-weight:400;color:var(--muted);font-size:11px;}
.vB .props{padding:0 12px 10px;display:flex;flex-direction:column;gap:5px;}
.vB .prop{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;min-height:24px;}
.vB .prop > label{color:var(--muted);}
.vB .field{display:flex;align-items:center;gap:6px;}
.vB .num{width:74px;height:22px;padding:0 6px;border-radius:4px;border:1px solid var(--border);background:var(--bg);text-align:right;}
.vB .num:focus{outline:1px solid var(--accent);}
.vB .unit{color:var(--muted);font-size:11px;}
.vB .meas{margin-left:auto;font-size:11px;color:var(--muted);}
.vB .pend{color:var(--accent);font-size:11px;}
.vB .chips{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px;}
.vB .chips button{padding:2px 8px;border-radius:3px;color:var(--muted);}
.vB .chips button.on{background:var(--panel2);color:var(--text);}
.vB .inlinebad{margin:0 12px 8px;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;background:#2a1618;border:1px solid #4a2226;color:#ff9b9b;font-size:11px;}
.vB .inlinebad button{margin-left:auto;color:#fff;}
.vB .ifoot{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:none;}
.vB .diff{font-size:11px;display:flex;gap:6px;}
.vB .diff s{color:var(--muted);}
.vB .diff b{color:var(--accent);font-weight:500;}
.vB .nodiff{font-size:11px;color:var(--muted);}
.vB .btns{display:flex;gap:6px;}
.vB .btns button{flex:1;height:26px;border-radius:4px;border:1px solid var(--border);text-align:center;}

<script>
'use strict';
/* ============================== state ============================== */
const VARIANTS = [
  {key:'A', name:'Instrument'},
  {key:'B', name:'Inspector'},
  {key:'C', name:'Tracks'},
];
const SIZES = {default:[1280,800,'1280×800'], half:[960,1040,'Half 1080p'], min:[960,600,'Min 960×600'], compact:[340,430,'Compact']};
const qs = new URLSearchParams(location.search);
const S = {
  variant: VARIANTS.some(v=>v.key===qs.get('variant')) ? qs.get('variant') : 'A',
  size: SIZES[qs.get('size')] ? qs.get('size') : 'default',
  daemon: qs.get('daemon') !== '0',
  view: 'gpu', sel: 0, range: 300,
  bFocus: 'overview', bDetails: false,
  cCurve: true,
  cDark: qs.get('theme')==='dark',
  auto: {enabled:true, game:'Cyberpunk 2077', profile:'Quiet', gpu:0},
  t: 0,
  events: [],
};
const curveQuiet = [[35,25],[55,32],[70,48],[82,72],[90,100]];
const curveBal   = [[35,30],[55,40],[68,58],[80,80],[88,100]];
const curvePerf  = [[30,35],[50,50],[62,68],[74,88],[84,100]];
function mkGpu(idx, o){
  return Object.assign({idx, pending:{}, hist:{temp:[],util:[],power:[],fan:[],gclk:[],mclk:[],vram:[]},
    t:{temp:40,util:5,power:30,fan:30,gclk:300,mclk:405,vram:1}}, o);
}
const GPUS = [
  mkGpu(0, {name:'NVIDIA GeForce RTX 4080 SUPER', short:'RTX 4080 SUPER', bus:'0000:01:00.0', vramTotal:16, mem:'16 GB GDDR6X', pcie:'PCIe 4.0 ×16', vbios:'95.03.4C.00.A1',
    fans:2, rpmKnown:true, limits:{powerMin:125, powerMax:350}, maxClk:2610, profile:'Quiet', startup:'Balanced', load:'game', ambient:30, thermal:0.12,
    presets:{Quiet:{powerLimit:250,gOffset:0,mOffset:0,lockMin:null,lockMax:null,fanMode:'curve',fanManual:50,curve:curveQuiet},
             Balanced:{powerLimit:320,gOffset:0,mOffset:0,lockMin:null,lockMax:null,fanMode:'curve',fanManual:50,curve:curveBal},
             Performance:{powerLimit:350,gOffset:150,mOffset:1000,lockMin:null,lockMax:null,fanMode:'curve',fanManual:60,curve:curvePerf}},
    coolingPaused:false}),
  mkGpu(1, {name:'NVIDIA RTX A2000 12GB', short:'RTX A2000', bus:'0000:05:00.0', vramTotal:12, mem:'12 GB GDDR6', pcie:'PCIe 4.0 ×16', vbios:'94.06.19.00.2C',
    fans:1, rpmKnown:false, limits:{powerMin:50, powerMax:70}, maxClk:1200, profile:'Compute', startup:'Compute', load:'compute', ambient:32, thermal:0.42,
    presets:{Compute:{powerLimit:70,gOffset:0,mOffset:0,lockMin:null,lockMax:null,fanMode:'curve',fanManual:60,curve:curveBal},
             Silent:{powerLimit:55,gOffset:0,mOffset:0,lockMin:null,lockMax:null,fanMode:'curve',fanManual:40,curve:curveQuiet}},
    coolingPaused:true}),
];
S.gpus = GPUS;
for (const g of GPUS) g.tuning = clone(g.presets[g.profile]);
S.events = [
  {t:'14:02', txt:'Cyberpunk 2077 started · automatic switch to Quiet on RTX 4080 SUPER', kind:'auto'},
  {t:'13:58', txt:'Fan curve paused on RTX A2000 after 3 failed fan writes', kind:'bad', action:'Resume'},
  {t:'09:12', txt:'Startup: applied Balanced to RTX 4080 SUPER, Compute to RTX A2000', kind:'ok'},
];

const G = () => S.gpus[S.sel];
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function eq(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function eff(g,k){ return k in g.pending ? g.pending[k] : g.tuning[k]; }
function curveAt(c,temp){
  if (temp<=c[0][0]) return c[0][1];
  for (let i=1;i<c.length;i++) if (temp<=c[i][0]) { const [x0,y0]=c[i-1],[x1,y1]=c[i]; return y0+(y1-y0)*(temp-x0)/(x1-x0); }
  return c[c.length-1][1];
}
function modified(g){ const p=g.presets[g.profile]; return !!p && !eq(p,g.tuning); }
function nPending(g){ return Object.keys(g.pending).length; }

/* ============================== simulation ============================== */
function noise(a){ return (Math.random()-.5)*2*a; }
function simStep(g,t){
  let target;
  if (g.load==='game'){ const ph=t%240; target = ph<25 ? 18+noise(4) : 68 + 18*Math.sin(t/37) + 8*Math.sin(t/9) + noise(5); }
  else target = 18 + 14*Math.max(0,Math.sin(t/55)) + noise(3);
  g.t.util = clamp(g.t.util + (target-g.t.util)*0.35, 0, 100);
  const pl = g.tuning.powerLimit, idle = g.limits.powerMin*0.18;
  g.t.power = clamp(idle + (g.limits.powerMax*0.86-idle)*g.t.util/100 + noise(g.limits.powerMax*0.012), 0, pl);
  const mode = g.tuning.fanMode;
  let fanT = mode==='curve' ? curveAt(g.tuning.curve, g.t.temp) : mode==='manual' ? g.tuning.fanManual : clamp((g.t.temp-35)*1.4+30,30,100);
  if (g.coolingPaused) fanT = g.t.fan;
  g.t.fan = clamp(g.t.fan + (fanT-g.t.fan)*0.15, 0, 100);
  const tempT = g.ambient + g.t.power*g.thermal*(1.25 - g.t.fan/180);
  g.t.temp = g.t.temp + (tempT-g.t.temp)*0.06;
  const atLimit = g.t.power >= pl-1.5;
  let clk = g.t.util>12 ? g.maxClk + g.tuning.gOffset - (atLimit?120+noise(30):noise(15)) : 210+noise(10);
  if (g.tuning.lockMin!=null) clk = Math.max(clk,g.tuning.lockMin);
  if (g.tuning.lockMax!=null) clk = Math.min(clk,g.tuning.lockMax);
  g.t.gclk = clk;
  g.t.mclk = g.t.util>8 ? (g.idx===0?11502:7001) + g.tuning.mOffset : 405;
  g.t.vram = clamp(g.vramTotal*(g.load==='game'?0.62:0.35) + noise(.05), 0, g.vramTotal);
  for (const k in g.hist){ g.hist[k].push(g.t[k]); if (g.hist[k].length>3600) g.hist[k].shift(); }
}
for (let i=0;i<3600;i++){ S.t=i; for (const g of GPUS) simStep(g,i); }

/* ============================== formatting ============================== */
const META = {
  temp:{min:20,max:()=>100,unit:'°C',color:'--temp',label:'Temperature',fmt:v=>v.toFixed(0)},
  util:{min:0,max:()=>100,unit:'%',color:'--util',label:'Utilization',fmt:v=>v.toFixed(0)},
  power:{min:0,max:g=>g.limits.powerMax,unit:'W',color:'--power',label:'Power draw',fmt:v=>v.toFixed(0)},
  fan:{min:0,max:()=>100,unit:'%',color:'--fan',label:'Fan speed',fmt:v=>v.toFixed(0)},
  gclk:{min:0,max:g=>g.maxClk+400,unit:'MHz',color:'--gclk',label:'Graphics clock',fmt:v=>v.toFixed(0)},
  mclk:{min:0,max:g=>g.idx===0?13000:8500,unit:'MHz',color:'--mclk',label:'Memory clock',fmt:v=>v.toFixed(0)},
  vram:{min:0,max:g=>g.vramTotal,unit:'GB',color:'--vram',label:'Memory used',fmt:v=>v.toFixed(1)},
};
const signed = v => (v>0?'+':v<0?'−':'±')+Math.abs(v)+' MHz';
const lockTxt = g => { const a=g.tuning.lockMin,b=g.tuning.lockMax; return a==null&&b==null?'off':`${a??'—'}–${b??'—'} MHz`; };
const fanModeName = {auto:'Auto', manual:'Fixed', curve:'Curve'};
const B = {
  name:g=>g.name, short:g=>g.short,
  temp:g=>g.t.temp.toFixed(0)+'°C', tempN:g=>g.t.temp.toFixed(0), util:g=>g.t.util.toFixed(0)+'%', power:g=>g.t.power.toFixed(0)+' W', powerN:g=>g.t.power.toFixed(0),
  fan:g=>g.t.fan.toFixed(0)+'%', fanN:g=>g.t.fan.toFixed(0),
  fan1rpm:g=>g.rpmKnown?Math.round(g.t.fan*31+180)+' rpm':'— rpm', fan2rpm:g=>g.rpmKnown?Math.round(g.t.fan*30.4+175)+' rpm':'— rpm',
  gclk:g=>g.t.gclk.toFixed(0)+' MHz', gclkN:g=>g.t.gclk.toFixed(0), mclk:g=>g.t.mclk.toFixed(0)+' MHz', vram:g=>g.t.vram.toFixed(1)+' / '+g.vramTotal+' GB', vramN:g=>g.t.vram.toFixed(1),
  enforced:g=>g.tuning.powerLimit+' W',
  powerLimitCur:g=>g.tuning.powerLimit+' W', powerLimitCurN:g=>g.tuning.powerLimit, powerLimitPend:g=>'→ '+eff(g,'powerLimit')+' W',
  gOffsetCur:g=>signed(g.tuning.gOffset), gOffsetPend:g=>'→ '+signed(eff(g,'gOffset')), gOffsetEff:g=>signed(eff(g,'gOffset')),
  mOffsetCur:g=>signed(g.tuning.mOffset), mOffsetPend:g=>'→ '+signed(eff(g,'mOffset')), mOffsetEff:g=>signed(eff(g,'mOffset')),
  lock:lockTxt, lockMinPend:g=>'→ '+(eff(g,'lockMin')??'—'), lockMaxPend:g=>'→ '+(eff(g,'lockMax')??'—'),
  fanModeCur:g=>fanModeName[g.tuning.fanMode], fanModePend:g=>'→ '+fanModeName[eff(g,'fanMode')],
  fanManualCur:g=>g.tuning.fanManual+'%', fanManualPend:g=>'→ '+eff(g,'fanManual')+'%',
  curvePend:g=>'edited', curveTarget:g=>curveAt(eff(g,'curve'),g.t.temp).toFixed(0)+'%',
  profile:g=>g.profile, profileMod:g=>modified(g)?'· not saved to profile':'',
  profileModShort:g=>modified(g)?'modified':'',
  pendingCount:g=>String(nPending(g)), pendingWord:g=>nPending(g)===1?'unapplied change':'unapplied changes',
  autoStatus:()=>!S.auto.enabled?'Automatic switching paused':`${S.auto.game} → ${S.auto.profile}`,
  daemon:()=>S.daemon?'prismd 0.9.2 connected':'prismd not running',
  problems:()=>{ const n=S.gpus.filter(x=>x.coolingPaused).length; return n?`${n} problem${n>1?'s':''}`:'No problems'; },
  stats:(g,el)=>{ const m=el.dataset.m, a=g.hist[m].slice(-S.range), mt=META[m]; const mx=Math.max(...a), mn=Math.min(...a), av=a.reduce((x,y)=>x+y,0)/a.length; return `${mt.fmt(mx)}|${mt.fmt(av)}|${mt.fmt(mn)}`; },
};

}

/* ============================== rendering + binding ============================== */
const win = document.getElementById('win');
let SCALE = 1;
function render(){
  closeOverlays();
  const [w,h] = SIZES[S.size];
  win.style.width = w+'px'; win.style.height = h+'px';
  win.className = 'win v'+S.variant+' sz-'+S.size+(S.variant==='C'&&S.cDark?' dark':'');
  win.innerHTML = {A:renderA,B:renderB,C:renderC}[S.variant]();
  fit(); bindCanvases(); update(); renderSwitcher();
  const p = new URLSearchParams(); p.set('variant',S.variant); if (S.size!=='default') p.set('size',S.size); if (!S.daemon) p.set('daemon','0'); if (S.variant==='C'&&S.cDark) p.set('theme','dark');
  history.replaceState(null,'','?'+p);
}
function fit(){
  const [w,h] = SIZES[S.size];
  SCALE = Math.min(1,(innerWidth-32)/w,(innerHeight-84)/h);
  win.style.transform = `scale(${SCALE})`;
  document.getElementById('stage').style.cssText = `width:${w*SCALE}px;height:${h*SCALE}px;margin-bottom:46px;display:flex;align-items:center;justify-content:center`;
}
const gOf = el => S.gpus[el.dataset.g!=null ? +el.dataset.g : S.sel];

function update(){
  const g = G();
  win.classList.toggle('pending', nPending(g)>0);
  win.classList.toggle('nod', !S.daemon);
  win.querySelectorAll('[data-b]').forEach(el=>{ const x=gOf(el); const v=B[el.dataset.b](x,el); if (el.textContent!==v) el.textContent=v; });
  win.querySelectorAll('[data-pend]').forEach(el=>{ const k=el.dataset.pend, x=gOf(el), on=k in x.pending; el.classList.toggle('on',on); if(on) el.textContent=(B[k+'Pend']||(()=>'→ edited'))(x); });
  win.querySelectorAll('[data-edit]').forEach(el=>{ const x=gOf(el), v=eff(x,el.dataset.edit); if (document.activeElement!==el) el.value = v==null?'':v; el.disabled=!S.daemon; });
  win.querySelectorAll('[data-set]').forEach(el=>el.classList.toggle('on', eff(gOf(el),el.dataset.set)===el.dataset.val));
  win.querySelectorAll('[data-range]').forEach(el=>el.classList.toggle('on', +el.dataset.range===S.range));
  win.querySelectorAll('[data-profile]').forEach(el=>el.classList.toggle('on', G().profile===el.dataset.profile));
  win.querySelectorAll('[data-when]').forEach(el=>{ const [k,vs]=el.dataset.when.split(':'); el.style.display = vs.split(',').includes(eff(gOf(el),k)) ? '' : 'none'; });
  win.querySelectorAll('[data-problem]').forEach(el=>el.classList.toggle('on', !!gOf(el).coolingPaused));
  win.querySelectorAll('[data-meter]').forEach(el=>{ const x=gOf(el), m=el.dataset.meter, mt=META[m]; el.style.width = clamp((x.t[m]-mt.min)/(mt.max(x)-mt.min),0,1)*100+'%'; });
  win.querySelectorAll('[data-statbox]').forEach(el=>{ const parts=B.stats(g,{dataset:{m:el.dataset.statbox}}).split('|'); el.querySelectorAll('[data-st]').forEach(s=>s.textContent=parts[+s.dataset.st]); });
  const dl = win.querySelector('[data-difflist]');
  if (dl) dl.innerHTML = nPending(g) ? Object.keys(g.pending).map(k=>`<div class="diff mono"><span class="muted" style="width:96px">${LABEL[k]}</span><s>${show(k,g.tuning[k])}</s>→<b>${show(k,g.pending[k])}</b></div>`).join('')
    : `<div class="nodiff">No unapplied changes. Edits are staged here until you apply them.</div>`;
  win.querySelectorAll('canvas[data-chart]').forEach(drawChart);
  win.querySelectorAll('canvas[data-curve]').forEach(drawCurve);
}
const LABEL = {powerLimit:'Power limit',gOffset:'Graphics offset',mOffset:'Memory offset',lockMin:'Lock min',lockMax:'Lock max',fanMode:'Fan mode',fanManual:'Fixed speed',curve:'Fan curve'};
function show(k,v){ if(k==='curve') return v.length+' pts'; if(k==='fanMode') return fanModeName[v]; if(k==='powerLimit') return v+' W'; if(k==='fanManual') return v+'%'; if(k.endsWith('Offset')) return signed(v); return v==null?'—':v+' MHz'; }

function setPending(g,k,v){
  if (!S.daemon) return;
  if (eq(v,g.tuning[k])) delete g.pending[k]; else g.pending[k]=v;
  update();
}
function apply(){
  const g=G(); if(!nPending(g)) return;
  const n=nPending(g); Object.assign(g.tuning, clone(g.pending)); g.pending={};
  S.events.unshift({t:now(), txt:`Applied ${n} change${n>1?'s':''} to ${g.short}`, kind:'ok'}); update();
}
function discard(){ G().pending={}; update(); }
function applyProfile(name){
  const g=G(); g.profile=name; g.tuning=clone(g.presets[name]); g.pending={};
  S.events.unshift({t:now(), txt:`Applied profile ${name} to ${g.short}`, kind:'ok'}); update();
}
const now = () => new Date().toTimeString().slice(0,5);

/* ---------- canvas drawing ---------- */
function hexA(hex,a){ hex=hex.trim(); if(hex[0]!=='#') return hex; const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function prep(cv){
  const w=cv.offsetWidth, h=cv.offsetHeight; if(!w||!h) return null;
  const dpr=Math.max(1,(window.devicePixelRatio||1)*SCALE);
  if (cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return {ctx,w,h,cs:getComputedStyle(cv)};
}
const V = (cs,n) => cs.getPropertyValue(n).trim();
function sample(g,m,range,cols){
  const a=g.hist[m], n=Math.min(range,a.length), d=a.slice(-n);
  if (n<=cols) return d;
  const out=[], step=n/cols; for(let i=0;i<cols;i++){ let s=0,c=0; for(let j=Math.floor(i*step);j<Math.floor((i+1)*step);j++){s+=d[j];c++;} out.push(s/c); } return out;
}
function series(P,g,m,x0,y0,w,h,o={}){
  const {ctx,cs}=P, mt=META[m], min=mt.min, max=mt.max(g);
  const d=sample(g,m,o.range||S.range,Math.max(2,Math.floor(w/1.5)));
  const X=i=>x0+i/(d.length-1)*w, Y=v=>y0+2+(h-4)-(clamp(v,min,max)-min)/(max-min)*(h-4);
  const col=V(cs,mt.color)||V(cs,'--line');
  ctx.beginPath(); d.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  if (o.fill){ ctx.save(); ctx.lineTo(X(d.length-1),y0+h); ctx.lineTo(x0,y0+h); ctx.closePath();
    const gr=ctx.createLinearGradient(0,y0,0,y0+h); gr.addColorStop(0,hexA(col,.28)); gr.addColorStop(1,hexA(col,0)); ctx.fillStyle=gr; ctx.fill(); ctx.restore();
    ctx.beginPath(); d.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v))); }
  ctx.strokeStyle=col; ctx.lineWidth=o.lw||1.4; ctx.lineJoin='round'; ctx.stroke();
  return {X,Y,d,min,max,col};
}
function grid(P,x0,y0,w,h,rows=3){
  const {ctx,cs}=P; ctx.strokeStyle=V(cs,'--grid'); ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<=rows;i++){ const y=Math.round(y0+h*i/(rows+1))+.5; ctx.moveTo(x0,y); ctx.lineTo(x0+w,y); }
  const cols=6; for(let i=1;i<cols;i++){ const x=Math.round(x0+w*i/cols)+.5; ctx.moveTo(x,y0); ctx.lineTo(x,y0+h); }
  ctx.stroke();
}
function drawChart(cv){
  const P=prep(cv); if(!P) return; const {ctx,w,h,cs}=P, g=gOf(cv);
  const font=V(cs,'--mono'), text=V(cs,'--text'), muted=V(cs,'--muted');
  ctx.font=`10px ${font}`;
  if (cv.dataset.lanes!=null){
    const lanes=cv.dataset.lanes.split(','), lh=h/lanes.length;
    lanes.forEach((m,i)=>{ const y0=i*lh; grid(P,0,y0+14,w,lh-18,1);
      if(i){ ctx.strokeStyle=V(cs,'--border'); ctx.beginPath(); ctx.moveTo(0,y0+.5); ctx.lineTo(w,y0+.5); ctx.stroke(); }
      const s=series(P,g,m,0,y0+14,w,lh-18,{fill:true});
      ctx.fillStyle=muted; ctx.fillText(META[m].label.toUpperCase(),4,y0+11);
      ctx.fillStyle=s.col; const val=META[m].fmt(g.t[m])+' '+META[m].unit; ctx.fillText(val,w-ctx.measureText(val).width-4,y0+11);
      if (cv._hx!=null){ const idx=Math.round(cv._hx/w*(s.d.length-1)), v=s.d[clamp(idx,0,s.d.length-1)];
        ctx.fillStyle=text; const t=META[m].fmt(v)+' '+META[m].unit; ctx.fillText(t,clamp(cv._hx+6,0,w-60),y0+11); }
    });
    if (cv._hx!=null){ ctx.strokeStyle=hexA(text,.5); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(cv._hx+.5,0); ctx.lineTo(cv._hx+.5,h); ctx.stroke(); ctx.setLineDash([]); }
    return;
  }
  const m=cv.dataset.m, axis=cv.dataset.axis!=null, L=axis?34:0;
  if (cv.dataset.nogrid==null) grid(P,L,0,w-L,h);
  const s=series(P,g,m,L,0,w-L,h,{fill:cv.dataset.style==='area', range:+cv.dataset.range||S.range});
  if (axis){ ctx.fillStyle=muted; [0,.5,1].forEach(f=>{ const v=s.min+(s.max-s.min)*f; ctx.fillText(Math.round(v)+'',2,h-f*h+(f===1?9:f===0?-2:3)); }); }
  if (cv.dataset.limit){
    const k=cv.dataset.limit, acc=V(cs,'--accent');
    const cur=g.tuning[k], y=Math.round(s.Y(cur))+.5;
    ctx.strokeStyle=acc; ctx.lineWidth=1.5; ctx.setLineDash(k in g.pending?[4,3]:[]); ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(w,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=acc; ctx.fillText(`limit ${cur} W`, w-ctx.measureText(`limit ${cur} W`).width-4, y-4);
    if (k in g.pending){ const pv=g.pending[k], py=Math.round(s.Y(pv))+.5; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(L,py); ctx.lineTo(w,py); ctx.stroke();
      ctx.fillRect(w-10,py-4,8,8); const t=`pending ${pv} W`; ctx.fillText(t, L+6, py-4); }
    else ctx.fillRect(w-10,y-4,8,8);
  }
  if (cv._hx!=null && cv._hx>L){ const idx=Math.round((cv._hx-L)/(w-L)*(s.d.length-1)), v=s.d[clamp(idx,0,s.d.length-1)];
    ctx.strokeStyle=hexA(text,.45); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(cv._hx+.5,0); ctx.lineTo(cv._hx+.5,h); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=text; ctx.fillText(META[m].fmt(v)+' '+META[m].unit, clamp(cv._hx+6,0,w-60), 12); }
}
const CT=[20,100], CF=[0,100];
function curveGeom(cv,w,h){ const big=cv.dataset.big!=null, l=big?40:30, r=big?16:14, t=big?14:8, bt=big?26:18;
  return {l,r,t,bt,X:v=>l+(v-CT[0])/(CT[1]-CT[0])*(w-l-r), Y:v=>t+(1-(v-CF[0])/(CF[1]-CF[0]))*(h-t-bt),
    iX:x=>CT[0]+(x-l)/(w-l-r)*(CT[1]-CT[0]), iY:y=>CF[0]+(1-(y-t)/(h-t-bt))*(CF[1]-CF[0])}; }
function drawCurve(cv){
  const P=prep(cv); if(!P) return; const {ctx,w,h,cs}=P, g=gOf(cv), C=curveGeom(cv,w,h);
  const acc=V(cs,'--accent'), line=V(cs,'--fan')||V(cs,'--line'), muted=V(cs,'--muted'), text=V(cs,'--text'), gridc=V(cs,'--grid');
  ctx.font=`10px ${V(cs,'--mono')}`; ctx.lineWidth=1;
  ctx.strokeStyle=gridc; ctx.beginPath();
  for(let tt=30;tt<=90;tt+=10){ const x=Math.round(C.X(tt))+.5; ctx.moveTo(x,C.t); ctx.lineTo(x,h-C.bt); }
  for(let f=20;f<=80;f+=20){ const y=Math.round(C.Y(f))+.5; ctx.moveTo(C.l,y); ctx.lineTo(w-C.r,y); }
  ctx.stroke();
  ctx.fillStyle=muted;
  for(let tt=20;tt<=100;tt+=20) ctx.fillText(tt+'°', C.X(tt)-8, h-C.bt+13);
  for(let f=0;f<=100;f+=50) ctx.fillText(f+'%', 2, C.Y(f)+3);
  const path = c => { ctx.beginPath(); ctx.moveTo(C.X(CT[0]),C.Y(c[0][1])); c.forEach(([x,y])=>ctx.lineTo(C.X(x),C.Y(y))); ctx.lineTo(C.X(CT[1]),C.Y(c[c.length-1][1])); };
  const dim = !S.daemon || g.coolingPaused;
  ctx.globalAlpha = dim ? .55 : 1;
  if ('curve' in g.pending){ path(g.tuning.curve); ctx.strokeStyle=hexA(muted,.9); ctx.setLineDash([4,3]); ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]); }
  const c=eff(g,'curve');
  path(c); ctx.lineTo(C.X(CT[1]),h-C.bt); ctx.lineTo(C.X(CT[0]),h-C.bt); ctx.closePath(); ctx.fillStyle=hexA(line,.1); ctx.fill();
  path(c); ctx.strokeStyle=('curve' in g.pending)?acc:line; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  c.forEach(([x,y],i)=>{ const px=C.X(x),py=C.Y(y); ctx.fillStyle=V(cs,'--panel')||'#000'; ctx.strokeStyle=cv._drag===i?acc:(('curve' in g.pending)?acc:line); ctx.lineWidth=1.8;
    ctx.beginPath(); if (S.variant==='C') ctx.rect(px-4,py-4,8,8); else ctx.arc(px,py,4.5,0,7); ctx.fill(); ctx.stroke();
    if (cv._drag===i||cv._hover===i){ ctx.fillStyle=text; ctx.fillText(`${x}° → ${y}%`, clamp(px+8,0,w-70), py-8); } });
  ctx.globalAlpha=1;
  // live marker: measured temperature and fan speed
  const tx=C.X(clamp(g.t.temp,CT[0],CT[1])), fy=C.Y(g.t.fan);
  ctx.strokeStyle=hexA(V(cs,'--temp')||acc,.8); ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(tx+.5,C.t); ctx.lineTo(tx+.5,h-C.bt); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=V(cs,'--temp')||acc; ctx.beginPath(); ctx.arc(tx,fy,4,0,7); ctx.fill();
  ctx.strokeStyle=V(cs,'--bg'); ctx.lineWidth=1.5; ctx.stroke();
  const lbl=`now ${g.t.temp.toFixed(0)}°C · fan ${g.t.fan.toFixed(0)}%`; ctx.fillStyle=text;
  ctx.fillText(lbl, clamp(tx+8,C.l,w-C.r-ctx.measureText(lbl).width), C.t+10);
  if (g.coolingPaused){ ctx.fillStyle=V(cs,'--danger'); ctx.fillText('PAUSED · fan held at last speed', C.l+6, h-C.bt-6); }
}
function bindCanvases(){
  win.querySelectorAll('canvas[data-chart]').forEach(cv=>{
    cv.addEventListener('pointermove',e=>{ cv._hx=e.offsetX; if(cv._dragging) dragLimit(cv,e); drawChart(cv); });
    cv.addEventListener('pointerleave',()=>{ cv._hx=null; drawChart(cv); });
    if (cv.dataset.drag){ cv.style.cursor='ns-resize';
      cv.addEventListener('pointerdown',e=>{ cv._dragging=true; cv.setPointerCapture(e.pointerId); dragLimit(cv,e); });
      cv.addEventListener('pointerup',()=>cv._dragging=false); }
  });
  win.querySelectorAll('canvas[data-curve]').forEach(cv=>{
    const pts = () => { const C=curveGeom(cv,cv.offsetWidth,cv.offsetHeight); return [C, eff(gOf(cv),'curve').map(([x,y])=>[C.X(x),C.Y(y)])]; };
    const near = e => { const [,p]=pts(); let best=-1,bd=12; p.forEach(([x,y],i)=>{ const d=Math.hypot(x-e.offsetX,y-e.offsetY); if(d<bd){bd=d;best=i;} }); return best; };
    cv.addEventListener('pointerdown',e=>{ const g=gOf(cv); if(!S.daemon||g.coolingPaused) return; const i=near(e); if(i<0) return; cv._drag=i; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove',e=>{
      if (cv._drag==null){ const i=near(e); cv._hover=i<0?null:i; cv.style.cursor=i<0?'default':'grab'; drawCurve(cv); return; }
      const g=gOf(cv), [C]=pts(), c=clone(eff(g,'curve')), i=cv._drag;
      const lo=i?c[i-1][0]+2:CT[0], hi=i<c.length-1?c[i+1][0]-2:CT[1];
      c[i]=[Math.round(clamp(C.iX(e.offsetX),lo,hi)), Math.round(clamp(C.iY(e.offsetY),0,100))];
      setPending(g,'curve',c);
    });
    cv.addEventListener('pointerup',()=>{ cv._drag=null; drawCurve(cv); });
  });
}
function dragLimit(cv,e){
  if(!S.daemon) return; const g=gOf(cv), k=cv.dataset.drag, mt=META[cv.dataset.m];
  const v=mt.max(g)*(1-e.offsetY/cv.offsetHeight);
  setPending(g,k,Math.round(clamp(v,g.limits.powerMin,g.limits.powerMax)/5)*5);
}

/* ---------- events ---------- */
win.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-select]'); if(!t||!win.contains(t)) return;
  const d=t.dataset;
  if (d.select!=null){ S.sel=+d.select; S.view='gpu'; if(S.size==='compact'){} render(); }
  else if (d.view){ S.view=d.view; render(); }
  else if (d.range){ S.range=+d.range; update(); }
  else if (d.step){ const g=G(), k=d.step; let v=eff(g,k)+(+d.d); if(k==='powerLimit') v=clamp(v,g.limits.powerMin,g.limits.powerMax); setPending(g,k,v); }
  else if (d.set){ setPending(G(),d.set,d.val); }
  else if (d.apply!=null) apply();
  else if (d.discard!=null) discard();
  else if (d.profile){ applyProfile(d.profile); }
  else if (d.menu){ e.stopPropagation(); openMenu(t); }
  else if (d.palette!=null){ e.stopPropagation(); openPalette(); }
  else if (d.activity!=null){ e.stopPropagation(); openActivity(); }
  else if (d.compact!=null){ S.size = S.size==='compact'?'default':'compact'; render(); }
  else if (d.focus){ if (d.focus==='details') S.bDetails=!S.bDetails; else S.bFocus = S.bFocus===d.focus && d.focus!=='overview' ? 'overview' : d.focus; render(); }
  else if (d.ccurve!=null){ S.cCurve=!S.cCurve; render(); }
  else if (d.theme!=null){ S.cDark=!S.cDark; render(); }
  else if (d.resume!=null){ resume(); }
});
function resume(){ for(const g of S.gpus) g.coolingPaused=false; S.events.unshift({t:now(),txt:'Fan curve resumed on RTX A2000',kind:'ok'}); update(); }
win.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.edit) return; const k=el.dataset.edit;
  let v = el.value===''?null:+el.value; if (v!=null && isNaN(v)) return;
  if (k==='powerLimit' && el.type==='number' && v!=null && (v<+el.min||v>+el.max)) return;
  setPending(gOf(el),k,v);
});

/* ---------- overlays (shared, themed) ---------- */
function closeOverlays(){ win.querySelectorAll('.ov').forEach(o=>o.remove()); }
document.addEventListener('click',e=>{ if(!e.target.closest('.ov')) closeOverlays(); });
function relRect(el){ const r=el.getBoundingClientRect(), w=win.getBoundingClientRect(); return {x:(r.left-w.left)/SCALE, y:(r.top-w.top)/SCALE, w:r.width/SCALE, h:r.height/SCALE}; }
function openMenu(anchor){
  closeOverlays(); const g=G(), r=relRect(anchor), m=document.createElement('div'); m.className='ov ov-menu';
  const items = Object.keys(g.presets).map(p=>`<button data-mp="${p}"><span style="width:12px">${g.profile===p?'✓':''}</span>${p}<span class="sp"></span><span class="muted">${g.startup===p?'startup':''}</span></button>`).join('')
    + `<hr><button data-ms ${modified(g)?'':'disabled'}><span style="width:12px"></span>Save to ${g.profile}</button><button><span style="width:12px"></span>Save as new profile…</button><button><span style="width:12px"></span>Manage profiles…</button><hr>`
    + (g.startup===g.profile?`<button disabled><span style="width:12px">✓</span>${g.profile} is the startup profile</button>`:`<button data-mst><span style="width:12px"></span>Use as startup profile</button>`);
  m.innerHTML=items; win.appendChild(m);
  const left = clamp(r.x + r.w - 220, 4, SIZES[S.size][0]-228);
  m.style.left=left+'px'; m.style.top=(r.y+r.h+4)+'px';
  m.addEventListener('click',e=>{ const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.mp) applyProfile(t.dataset.mp);
    else if(t.dataset.ms!=null){ g.presets[g.profile]=clone(g.tuning); }
    else if(t.dataset.mst!=null){ g.startup=g.profile; render(); return; }
    closeOverlays(); update(); });
}
function openActivity(){
  closeOverlays(); const a=document.createElement('div'); a.className='ov ov-activity';
  const probs = S.gpus.filter(g=>g.coolingPaused);
  a.innerHTML = `<h3>Problems</h3>${probs.length?probs.map(g=>`<div class="ev"><span class="bad">●</span><span>${g.short}: ${problemTxt}</span><span class="sp"></span><button class="act" data-resume>Resume</button></div>`).join(''):'<div class="ev muted">No problems</div>'}
    <h3 style="margin-top:12px">Recent</h3>${S.events.slice(0,6).map(ev=>`<div class="ev"><span class="muted mono" style="font-size:11px">${ev.t}</span><span>${ev.txt}</span></div>`).join('')}`;
  win.appendChild(a);
  a.addEventListener('click',e=>{ if(e.target.closest('[data-resume]')){ resume(); openActivity(); } });
}
function commands(){
  const g=G(), c=[];
  Object.keys(g.presets).forEach(p=>c.push([`Apply profile ${p}`, ()=>applyProfile(p)]));
  S.gpus.forEach((x,i)=>c.push([`Go to ${x.short}`, ()=>{S.sel=i;S.view='gpu';render();}]));
  NAVS.forEach(([k,l])=>c.push([`Go to ${l}`, ()=>{S.view=k;render();}]));
  c.push([S.auto.enabled?'Pause automatic switching':'Resume automatic switching', ()=>{S.auto.enabled=!S.auto.enabled;update();}]);
  c.push(['Apply changes', apply], ['Discard changes', discard], ['Toggle compact mode', ()=>{S.size=S.size==='compact'?'default':'compact';render();}], ...(S.variant==='C'?[['Toggle dark mode', ()=>{S.cDark=!S.cDark;render();}]]:[]), ['Open Activity', ()=>setTimeout(openActivity)]);
  return c;
}
function openPalette(){
  closeOverlays(); const p=document.createElement('div'); p.className='ov ov-palette';
  if (S.size==='compact'){ p.style.width='320px'; p.style.marginLeft='-160px'; p.style.top='36px'; }
  p.innerHTML=`<input placeholder="Type a command…"><div class="items"></div>`; win.appendChild(p);
  const inp=p.querySelector('input'), list=p.querySelector('.items'); let sel=0, cur=[];
  const draw=()=>{ const q=inp.value.toLowerCase(); cur=commands().filter(c=>c[0].toLowerCase().includes(q)); sel=clamp(sel,0,cur.length-1);
    list.innerHTML=cur.map((c,i)=>`<div class="it ${i===sel?'on':''}" data-i="${i}">${c[0]}</div>`).join(''); };
  inp.addEventListener('input',()=>{sel=0;draw();});
  inp.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){sel++;draw();e.preventDefault();} else if(e.key==='ArrowUp'){sel--;draw();e.preventDefault();}
    else if(e.key==='Enter'&&cur[sel]){ const f=cur[sel][1]; closeOverlays(); f(); } else if(e.key==='Escape') closeOverlays(); });
  list.addEventListener('click',e=>{ const it=e.target.closest('.it'); if(it){ const f=cur[+it.dataset.i][1]; closeOverlays(); f(); } });
  draw(); inp.focus();
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); apply(); return; }
  if (e.key==='Escape'){ closeOverlays(); return; }
  const a=document.activeElement; if (a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable)) return;
  if (e.key==='ArrowRight'||e.key==='ArrowLeft'){ cycle(e.key==='ArrowRight'?1:-1); }
});
function cycle(d){ const i=VARIANTS.findIndex(v=>v.key===S.variant); S.variant=VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].key; render(); }

/* ---------- prototype switcher ---------- */
function renderSwitcher(){
  const sw=document.getElementById('switcher'), v=VARIANTS.find(x=>x.key===S.variant);
  sw.innerHTML=`<span class="tag">PROTOTYPE</span><button data-c="-1">←</button><span class="lbl">${v.key} · ${v.name}</span><button data-c="1">→</button><span class="div"></span>
    ${Object.entries(SIZES).map(([k,s])=>`<button data-size="${k}" class="${S.size===k?'on':''}">${s[2]}</button>`).join('')}<span class="div"></span>
    <button data-daemon class="${S.daemon?'':'on'}">${S.daemon?'Daemon: on':'Daemon: off'}</button>
    ${S.variant==='C'?`<button data-sdark class="${S.cDark?'on':''}">${S.cDark?'Dark':'Light'}</button>`:''}`;
}
document.getElementById('switcher').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if (t.dataset.c) cycle(+t.dataset.c);
  else if (t.dataset.size){ S.size=t.dataset.size; render(); }
  else if (t.dataset.sdark!=null){ S.cDark=!S.cDark; render(); }
  else if (t.dataset.daemon!=null){ S.daemon=!S.daemon; if(!S.daemon) for(const g of S.gpus) g.pending={}; render(); }
});

/* ---------- go ---------- */
addEventListener('resize',()=>{ fit(); update(); });
setInterval(()=>{ S.t++; for(const g of S.gpus) simStep(g,S.t); update(); }, 1000);
render();
</script>
</body>
