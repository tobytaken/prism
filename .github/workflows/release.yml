name: Release

# Pushing a tag vX.Y.Z runs CI on it and publishes a GitHub release with every package, built from
# that commit, and its source.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: bash scripts/publish-release.sh "$GITHUB_REF_NAME" artifacts
        env:
          GH_TOKEN: ${{ github.token }}
