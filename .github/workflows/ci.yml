name: CI

on:
  workflow_dispatch:
  # The release workflow runs CI on the tag and publishes what it builds.
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint's build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dbus-daemon runs the single-instance tests' private session bus, and Xvfb the window
      # failure test's display. The window failure test also starts prism, which loads the
      # windowing libraries the prism-gpu deb depends on; the runner image lacks some of them.
      - name: Install Slint's build dependencies, dbus-daemon, Xvfb and prism's windowing libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev dbus-daemon xvfb
          libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-egl1 libegl1 libgl1
          libx11-6 libx11-xcb1 libxcb1 libxcursor1 libxi6 libxrender1
      # The screenshot tests run only in the pinned image (the screenshots job).
      - run: cargo test --locked --workspace --all-features -- --skip "screenshot::"

  screenshots:
    runs-on: ubuntu-latest
    # One pinned image, where the reference PNGs come from. Keep the image and packages in step
    # with scripts/update-screenshots.sh.
    container: rust:1.99.0-slim-trixie@sha256:2752b332db73fdbb7dc576f06c82ed1f312005784ef913d7e04a28f5f55dc581
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint's build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p prism --test screenshots
      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/tmp/screenshots/

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo deny --locked check licenses
      - name: THIRD-PARTY-LICENSES matches Cargo.lock
        run: |
          bash scripts/generate-third-party-licenses.sh
          git diff --exit-code -- THIRD-PARTY-LICENSES

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh contrib/debian/prismd/postinst
      # The rpm scriptlets have no shebang; rpm runs them with /bin/sh.
      - run: shellcheck --shell=sh contrib/rpm/prismd/*
      - run: bash scripts/check-prismd-host-install.sh

  build-release:
    runs-on: ubuntu-latest
    # The old-glibc baseline (2.28): the deb, rpm and AppImage all repackage these two binaries.
    # Keep BASELINE_GLIBC in scripts/check-prism-package.sh in step with this image.
    container: almalinux:8
    steps:
      - name: Install Slint's build dependencies
        run: dnf install -y gcc git pkgconf-pkg-config fontconfig-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p prism -p prismd
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/prism
            target/release/prismd
          if-no-files-found: error

  package-prismd:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.6.3,cargo-generate-rpm@0.20.0
      - name: Release builds leave out the simulated GPU provider
        run: |
          if cargo tree --locked --workspace --edges normal,build,features --invert prism-gpu | grep -F 'feature "simulated"'; then
            echo "A release build enables prism-gpu's simulated feature." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release
      # Artifacts don't keep the executable bit.
      - run: chmod +x target/release/prismd
      - run: bash scripts/package-prismd-deb.sh
      - run: bash scripts/package-prismd-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prismd-packages
          path: |
            target/debian/prismd_*.deb
            target/generate-rpm/prismd-*.rpm
          if-no-files-found: error

  install-prismd-packages:
    needs: [package-prismd, package-aur]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            package: debian/prismd_*.deb
          - image: debian:12
            package: debian/prismd_*.deb
          # systemd 239, older than the update helper the scriptlets prefer.
          - image: almalinux:8
            package: generate-rpm/prismd-*.rpm
          - image: fedora:latest
            package: generate-rpm/prismd-*.rpm
          - image: archlinux:latest
            package: aur/prismd-[0-9]*.pkg.tar.zst
    # Each check boots systemd in a container, so the deb's start, the rpm's presets and the Arch
    # package's leaving prismd alone show as they would on a host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prismd-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: packages/aur
      - run: bash scripts/run-in-systemd-container.sh ${{ matrix.image }} bash scripts/check-prismd-install.sh packages/${{ matrix.package }}

  package-prism:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.6.3,cargo-generate-rpm@0.20.0
      - name: Install the package checks' tools
        run: sudo apt-get update && sudo apt-get install -y appstream cpio desktop-file-utils rpm
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release
      # Artifacts don't keep the executable bit.
      - run: chmod +x target/release/prism
      - run: desktop-file-validate contrib/io.github.tobytaken.Prism.desktop
      # Offline: the URLs it lists resolve only once the repo and its release are public.
      - run: appstreamcli validate --no-net contrib/io.github.tobytaken.Prism.metainfo.xml
      - run: bash scripts/package-prism-deb.sh
      - run: bash scripts/package-prism-rpm.sh
      - run: bash scripts/package-prism-appimage.sh
      - run: bash scripts/check-prism-package.sh deb target/debian/prism-gpu_*.deb
      - run: bash scripts/check-prism-package.sh rpm target/generate-rpm/prism-gpu-*.rpm
      - run: bash scripts/check-prism-package.sh appimage target/appimage/Prism-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: prism-packages
          path: |
            target/debian/prism-gpu_*.deb
            target/generate-rpm/prism-gpu-*.rpm
            target/appimage/Prism-x86_64.AppImage
          if-no-files-found: error

  install-prism-packages:
    needs: [package-prism, package-aur]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            package: debian/prism-gpu_*.deb
          - image: debian:12
            package: debian/prism-gpu_*.deb
          - image: almalinux:8
            package: generate-rpm/prism-gpu-*.rpm
          - image: fedora:latest
            package: generate-rpm/prism-gpu-*.rpm
          - image: archlinux:latest
            package: aur/prism-gpu-[0-9]*.pkg.tar.zst
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prism-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: packages/aur
      - run: bash scripts/check-prism-install.sh packages/${{ matrix.package }}

  # The AUR's split PKGBUILD, built from the checkout's source tarball in a clean Arch container.
  package-aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git archive makes the source tarball, so the checkout needs git.
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      # The container's root doesn't own the runner's checkout, which git refuses otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/render-aur-pkgbuild.sh
      - run: bash scripts/build-aur-package.sh
      - run: bash scripts/check-prism-package.sh aur target/aur/prism-gpu-[0-9]*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: |
            target/aur/PKGBUILD
            target/aur/prismd.install
            target/aur/.SRCINFO
            target/aur/prism-*.tar.gz
            target/aur/*.pkg.tar.zst
          include-hidden-files: true
          if-no-files-found: error

  package-prism-flatpak:
    runs-on: ubuntu-latest
    # flatpak-builder with the freedesktop 26.08 runtime preinstalled; the Flatpak builds from source.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package-prism-flatpak.sh
      - run: bash scripts/check-prism-package.sh flatpak target/flatpak/build
      # The manifest and cargo-sources.json to submit to Flathub, building from this commit's tag.
      # The container's root doesn't own the runner's checkout, which git refuses otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/render-flathub-manifest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prism-flatpak
          path: target/flatpak/prism.flatpak
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flathub
          path: target/flathub/
          if-no-files-found: error
