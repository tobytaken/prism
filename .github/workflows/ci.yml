name: CI

on:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint's build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dbus-daemon runs the single-instance tests' private session bus.
      - name: Install Slint's build dependencies and dbus-daemon
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev dbus-daemon
      # The screenshot tests run only in the pinned image (the screenshots job).
      - run: cargo test --locked --workspace --all-features -- --skip "screenshot::"

  screenshots:
    runs-on: ubuntu-latest
    # One pinned image, where the reference PNGs come from. Keep the image and packages in step
    # with scripts/update-screenshots.sh.
    container: rust:1.99.0-slim-trixie@sha256:2752b332db73fdbb7dc576f06c82ed1f312005784ef913d7e04a28f5f55dc581
    steps:
      - uses: actions/checkout@v4
      - name: Install Slint's build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p prism --test screenshots
      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/tmp/screenshots/

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo deny --locked check licenses
      - name: THIRD-PARTY-LICENSES matches Cargo.lock
        run: |
          bash scripts/generate-third-party-licenses.sh
          git diff --exit-code -- THIRD-PARTY-LICENSES

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.6.3,cargo-generate-rpm@0.20.0
      - name: Release builds leave out the simulated GPU provider
        run: |
          if cargo tree --locked --workspace --edges normal,build,features --invert prism-gpu | grep -F 'feature "simulated"'; then
            echo "A release build enables prism-gpu's simulated feature." >&2
            exit 1
          fi
      - run: bash scripts/package-prismd-deb.sh
      - run: bash scripts/package-prismd-rpm.sh

  build-prism-release:
    runs-on: ubuntu-latest
    # The old-glibc baseline (2.28): the GUI's deb, rpm and AppImage all repackage this one binary.
    # Keep BASELINE_GLIBC in scripts/check-prism-package.sh in step with this image.
    container: almalinux:8
    steps:
      - name: Install Slint's build dependencies
        run: dnf install -y gcc git pkgconf-pkg-config fontconfig-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p prism
      - uses: actions/upload-artifact@v4
        with:
          name: prism-release-binary
          path: target/release/prism
          if-no-files-found: error

  package-prism:
    needs: build-prism-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.6.3,cargo-generate-rpm@0.20.0
      - name: Install the package checks' tools
        run: sudo apt-get update && sudo apt-get install -y cpio desktop-file-utils rpm
      - uses: actions/download-artifact@v4
        with:
          name: prism-release-binary
          path: target/release
      # Artifacts don't keep the executable bit.
      - run: chmod +x target/release/prism
      - run: desktop-file-validate contrib/io.github.tobytaken.Prism.desktop
      - run: bash scripts/package-prism-deb.sh
      - run: bash scripts/package-prism-rpm.sh
      - run: bash scripts/package-prism-appimage.sh
      - run: bash scripts/check-prism-package.sh deb target/debian/prism-gpu_*.deb
      - run: bash scripts/check-prism-package.sh rpm target/generate-rpm/prism-gpu-*.rpm
      - run: bash scripts/check-prism-package.sh appimage target/appimage/Prism-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: prism-packages
          path: |
            target/debian/prism-gpu_*.deb
            target/generate-rpm/prism-gpu-*.rpm
            target/appimage/Prism-x86_64.AppImage
          if-no-files-found: error

  install-prism-packages:
    needs: package-prism
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            package: debian/prism-gpu_*.deb
          - image: debian:12
            package: debian/prism-gpu_*.deb
          - image: almalinux:8
            package: generate-rpm/prism-gpu-*.rpm
          - image: fedora:latest
            package: generate-rpm/prism-gpu-*.rpm
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prism-packages
          path: packages
      - run: bash scripts/check-prism-install.sh packages/${{ matrix.package }}

  package-prism-flatpak:
    runs-on: ubuntu-latest
    # flatpak-builder with the freedesktop 26.08 runtime preinstalled; the Flatpak builds from source.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package-prism-flatpak.sh
      - run: bash scripts/check-prism-package.sh flatpak target/flatpak/build
      - uses: actions/upload-artifact@v4
        with:
          name: prism-flatpak
          path: target/flatpak/prism.flatpak
          if-no-files-found: error
