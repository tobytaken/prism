[package]
name = "prism"
description = "Prism, a Linux GPU control center for NVIDIA GPUs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Runs on simulated GPUs with `PRISM_SIMULATE=<fixture>`; release builds leave this out.
simulated = ["prism-gpu/simulated"]

[dependencies]
prism-gpu.workspace = true
prism-ui.workspace = true
serde.workspace = true
slint.workspace = true
toml.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# The software renderer draws the screenshot tests.
i-slint-backend-testing = { workspace = true, features = ["renderer-software"] }
png.workspace = true
prism-gpu = { workspace = true, features = ["simulated"] }
tempfile.workspace = true

[lints]
workspace = true
