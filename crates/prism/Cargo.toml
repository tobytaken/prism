[package]
name = "prism"
description = "Prism, a Linux GPU control center for NVIDIA GPUs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Runs on simulated GPUs with `PRISM_SIMULATE=<fixture>`; release builds leave this out.
simulated = ["prism-gpu/simulated"]

[dependencies]
prism-gpu.workspace = true
prism-protocol.workspace = true
prism-ui.workspace = true
serde.workspace = true
slint.workspace = true
toml.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
# The software renderer draws the screenshot tests.
i-slint-backend-testing = { workspace = true, features = ["renderer-software"] }
i-slint-core.workspace = true
png.workspace = true
prism-gpu = { workspace = true, features = ["simulated"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# The GUI package is `prism-gpu` on every distro (#120). The packages repackage one release binary
# built on an old glibc, so they're built with `--no-build` (scripts/package-prism-*.sh).
[package.metadata.deb]
name = "prism-gpu"
maintainer = "Tobias Steinhaeusler"
license-file = ["../../LICENSE", "0"]
# Spelled out, since dpkg-shlibdeps on a newer build host asks for its own glibc and can't see the
# windowing and GL libraries Slint loads at runtime. scripts/check-prism-package.sh and
# scripts/check-prism-install.sh check these cover what the binary links and loads.
depends = "libc6 (>= 2.28), libgcc-s1 | libgcc1, libfontconfig1 (>= 2.12.6), libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libegl1, libgl1, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxrender1"
recommends = "prismd"
section = "utils"
priority = "optional"
assets = [
  ["target/release/prism", "usr/bin/prism", "755"],
  ["../../contrib/io.github.tobytaken.Prism.desktop", "usr/share/applications/io.github.tobytaken.Prism.desktop", "644"],
  ["../../assets/io.github.tobytaken.Prism.svg", "usr/share/icons/hicolor/scalable/apps/io.github.tobytaken.Prism.svg", "644"],
  ["../../README.md", "usr/share/doc/prism-gpu/README.md", "644"],
  ["../../THIRD-PARTY-LICENSES", "usr/share/doc/prism-gpu/THIRD-PARTY-LICENSES", "644"]
]

[package.metadata.generate-rpm]
name = "prism-gpu"
summary = "Prism, a Linux GPU control center for NVIDIA GPUs"
# Spelled out, since the builtin discovery lists the build host's indirect libraries and can't see
# what Slint loads at runtime. Keep in step with the deb's depends above.
auto-req = "no"
assets = [
  { source = "target/release/prism", dest = "/usr/bin/prism", mode = "755" },
  { source = "../../contrib/io.github.tobytaken.Prism.desktop", dest = "/usr/share/applications/io.github.tobytaken.Prism.desktop", mode = "644" },
  { source = "../../assets/io.github.tobytaken.Prism.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.tobytaken.Prism.svg", mode = "644" },
  { source = "../../README.md", dest = "/usr/share/doc/prism-gpu/README.md", mode = "644", doc = true },
  { source = "../../LICENSE", dest = "/usr/share/licenses/prism-gpu/LICENSE", mode = "644", doc = true },
  { source = "../../THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/prism-gpu/THIRD-PARTY-LICENSES", mode = "644", doc = true }
]

[package.metadata.generate-rpm.requires]
"libc.so.6(GLIBC_2.28)(64bit)" = "*"
"libgcc_s.so.1()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libxcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
prismd = "*"
