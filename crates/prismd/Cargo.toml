[package]
name = "prismd"
description = "Privileged daemon for Prism"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "cooling_supervision"
harness = false

[dependencies]
libc.workspace = true
prism-drivers.workspace = true
prism-gpu.workspace = true
prism-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
users.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Tobias Steinhaeusler"
license-file = ["../../LICENSE", "0"]
depends = "$auto"
section = "utils"
priority = "optional"
# The postinst creates /run/prism from the tmpfiles.d entry; cargo-deb adds the systemd fragments.
maintainer-scripts = "../../contrib/debian/prismd"
# Installs contrib/systemd/prismd.service under /usr/lib/systemd/system. Debian enables and starts
# a packaged service (#99), and restarts it after an upgrade.
systemd-units = { unit-scripts = "../../contrib/systemd", enable = true, start = true }
assets = [
  ["target/release/prismd", "usr/bin/prismd", "755"],
  ["../../contrib/tmpfiles.d/prismd.conf", "usr/lib/tmpfiles.d/prismd.conf", "644"],
  ["../../contrib/prismd.toml", "etc/prism/prismd.toml", "644"],
  ["../../README.md", "usr/share/doc/prismd/README.md", "644"],
  ["../../THIRD-PARTY-LICENSES", "usr/share/doc/prismd/THIRD-PARTY-LICENSES", "644"]
]

[package.metadata.generate-rpm]
summary = "Privileged daemon for Prism"
auto-req = "no"
# cargo-generate-rpm has no systemd macros, so these mirror them: presets decide whether prismd is
# enabled (#99). The unit sits under /usr/lib so systemd's file triggers reload and restart it.
post_install_script = "../../contrib/rpm/prismd/post"
pre_uninstall_script = "../../contrib/rpm/prismd/preun"
post_uninstall_script = "../../contrib/rpm/prismd/postun"
assets = [
  { source = "target/release/prismd", dest = "/usr/bin/prismd", mode = "755" },
  { source = "../../contrib/systemd/prismd.service", dest = "/usr/lib/systemd/system/prismd.service", mode = "644" },
  { source = "../../contrib/tmpfiles.d/prismd.conf", dest = "/usr/lib/tmpfiles.d/prismd.conf", mode = "644" },
  { source = "../../contrib/prismd.toml", dest = "/etc/prism/prismd.toml", mode = "644", config = "noreplace" },
  { source = "../../README.md", dest = "/usr/share/doc/prismd/README.md", mode = "644", doc = true },
  # Not doc = true, so the licenses install even where docs are skipped, as %license files do.
  { source = "../../LICENSE", dest = "/usr/share/licenses/prismd/LICENSE", mode = "644" },
  { source = "../../THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/prismd/THIRD-PARTY-LICENSES", mode = "644" }
]

# What the scriptlets run, as %systemd_requires asks for.
[package.metadata.generate-rpm.requires]
systemd = "*"
